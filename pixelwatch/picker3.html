<!doctype html>
<meta charset="utf-8">
<title>Pick three pixels</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #14161a; color: #e6e8eb;
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; padding: 10px 16px;
    background: #1b1e24; border-bottom: 1px solid #2b2f36;
  }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .rule { color: #9aa2ad; font-size: 13px; }
  .hint { color: #6f7680; font-size: 12px; }
  .readout { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .swatch {
    width: 24px; height: 24px; border-radius: 5px;
    border: 1px solid #454b55; background: #000;
  }
  code {
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    background: #262a31; padding: 2px 7px; border-radius: 4px;
  }
  button {
    font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 6px;
    border: 1px solid transparent; background: #3b82f6; color: #fff; cursor: pointer;
  }
  button.ghost { background: #2b313a; border-color: #3a424d; }
  button:disabled { background: #333941; color: #71787f; cursor: default; border-color: transparent; }
  #steps { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .step {
    display: flex; align-items: center; gap: 7px; font-size: 12px;
    padding: 4px 10px; border-radius: 999px;
    background: #22262d; border: 1px solid #2b2f36; color: #9aa2ad;
  }
  .step.active { border-color: #3b82f6; color: #e6e8eb; }
  .step.done { color: #e6e8eb; }
  .step .dot {
    width: 11px; height: 11px; border-radius: 3px;
    border: 1px solid #454b55; background: #14161a;
  }
  .cap { margin-left: auto; font-size: 12px; color: #6f7680; }
  #wrap { position: relative; padding: 16px; }
  #shot { display: block; max-width: 100%; height: auto; cursor: crosshair; }
  .marker {
    position: absolute; width: 15px; height: 15px; margin: -8px 0 0 -8px;
    border: 2px solid #ff3b30; border-radius: 50%; pointer-events: none;
    box-shadow: 0 0 0 1px #fff;
  }
  .marker.placed { border-color: #34c759; }
  .marker .tag {
    position: absolute; left: 17px; top: -3px; font-size: 11px; font-weight: 700;
    color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(12,14,17,.93); color: #e6e8eb;
    align-items: center; justify-content: center; text-align: center;
  }
  #overlay.on { display: flex; }
  #overlay .big { font-size: 58px; font-weight: 700; line-height: 1.1; }
  #lens {
    position: fixed; right: 20px; bottom: 20px; width: 210px;
    background: #1b1e24; border: 1px solid #2b2f36; border-radius: 8px;
    padding: 10px; display: none;
  }
  #lens canvas {
    width: 190px; height: 190px; display: block;
    image-rendering: pixelated; border-radius: 4px; background: #000;
  }
  #lens p { margin: 8px 0 0; text-align: center; font-size: 12px; color: #9aa2ad; }
  #done { display: none; padding: 40px 16px; text-align: center; font-size: 15px; }
  #done table { margin: 16px auto; border-collapse: collapse; }
  #done td { padding: 5px 12px; text-align: left; }
</style>

<header>
  <div class="row">
    <h1 id="title">Pick spot 1 of 3</h1>
    <span class="rule" id="rule"></span>
    <span class="hint">click &middot; arrows nudge &middot; Enter confirms</span>
    <div class="readout">
      <div class="swatch" id="swatch"></div>
      <code id="coords">&mdash;</code>
      <button class="ghost" id="recap">Recapture</button>
      <button id="next" disabled>Next</button>
    </div>
  </div>
  <div id="steps"></div>
</header>

<div id="wrap">
  <img id="shot" alt="screenshot">
</div>

<div id="overlay">
  <div>
    <div class="big" id="cdNum">5</div>
    <p>Switch to the window you want to capture.<br>Screenshot is taken automatically.</p>
  </div>
</div>

<div id="lens"><canvas id="lensCanvas" width="19" height="19"></canvas><p id="lensLabel">&mdash;</p></div>
<div id="done"></div>

<script>
(async () => {
  let meta = await (await fetch("/meta")).json();
  const SPOTS = meta.spots;

  const img = document.getElementById("shot");
  const wrap = document.getElementById("wrap");
  const lens = document.getElementById("lens");
  const lensCtx = document.getElementById("lensCanvas").getContext("2d");
  const lensLabel = document.getElementById("lensLabel");
  const swatch = document.getElementById("swatch");
  const coords = document.getElementById("coords");
  const nextBtn = document.getElementById("next");
  const recapBtn = document.getElementById("recap");
  const title = document.getElementById("title");
  const rule = document.getElementById("rule");
  const stepsEl = document.getElementById("steps");
  const overlay = document.getElementById("overlay");
  const cdNum = document.getElementById("cdNum");

  lensCtx.imageSmoothingEnabled = false;

  // Offscreen copy of the current screenshot at natural (physical) size, for
  // exact pixel reads.
  const off = document.createElement("canvas");
  const offCtx = off.getContext("2d", { willReadFrequently: true });

  async function loadShot() {
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = rej;
      img.src = "/shot.png?v=" + meta.captureId;
    });
    off.width = img.naturalWidth;
    off.height = img.naturalHeight;
    offCtx.drawImage(img, 0, 0);
  }
  await loadShot();

  // Each entry: { x, y, color, captureId }. The colour is taken from the
  // screenshot that was loaded when the pixel was chosen, and is NOT
  // recomputed later - a recapture must not rewrite an earlier spot's colour.
  const picked = SPOTS.map(() => null);
  let current = 0;

  const colorAtPhysical = (px, py) => {
    const d = offCtx.getImageData(px, py, 1, 1).data;
    return { r: d[0], g: d[1], b: d[2] };
  };
  const hex = ({ r, g, b }) =>
    "#" + [r, g, b].map((c) => c.toString(16).padStart(2, "0")).join("");

  // A logical pixel maps to the top-left of its scale x scale physical block,
  // which is the sample nut-js colorAt returns.
  const physOf = (lx, ly) => [Math.round(lx * meta.scale), Math.round(ly * meta.scale)];

  function setPick(lx, ly) {
    const [px, py] = physOf(lx, ly);
    picked[current] = {
      x: lx, y: ly,
      color: colorAtPhysical(px, py),
      captureId: meta.captureId,
    };
  }

  function drawMarkers() {
    for (const m of wrap.querySelectorAll(".marker")) m.remove();
    const rect = img.getBoundingClientRect();
    const dispScale = rect.width / img.naturalWidth;
    picked.forEach((p, i) => {
      if (!p) return;
      const [px, py] = physOf(p.x, p.y);
      const el = document.createElement("div");
      el.className = "marker" + (i === current ? "" : " placed");
      el.style.left = (img.offsetLeft + px * dispScale) + "px";
      el.style.top = (img.offsetTop + py * dispScale) + "px";
      el.innerHTML = '<span class="tag">' + (i + 1) + "</span>";
      wrap.appendChild(el);
    });
  }

  function drawSteps() {
    stepsEl.innerHTML = "";
    SPOTS.forEach((s, i) => {
      const p = picked[i];
      const el = document.createElement("div");
      el.className = "step" + (i === current ? " active" : p ? " done" : "");
      el.innerHTML =
        '<span class="dot" style="background:' + (p ? hex(p.color) : "#14161a") + '"></span>' +
        (i + 1) + ". " + s.label +
        (p ? " &middot; " + p.x + "," + p.y + " &middot; shot #" + p.captureId : "");
      stepsEl.appendChild(el);
    });
    const cap = document.createElement("span");
    cap.className = "cap";
    cap.textContent = "showing screenshot #" + meta.captureId;
    stepsEl.appendChild(cap);
  }

  function paint() {
    title.textContent = "Pick spot " + (current + 1) + " of " + SPOTS.length +
                        " — " + SPOTS[current].label;
    rule.textContent = SPOTS[current].rule;
    nextBtn.textContent = current === SPOTS.length - 1 ? "Save" : "Next";

    const p = picked[current];
    if (!p) {
      coords.textContent = "—";
      swatch.style.background = "#000";
      nextBtn.disabled = true;
      lens.style.display = "none";
    } else {
      coords.textContent = "x=" + p.x + "  y=" + p.y + "  " + hex(p.color);
      swatch.style.background = hex(p.color);
      nextBtn.disabled = false;

      // The lens shows the live screenshot around the point. If the spot was
      // picked on an older capture the surroundings may differ; the stored
      // colour still wins.
      const [px, py] = physOf(p.x, p.y);
      lens.style.display = "block";
      lensCtx.clearRect(0, 0, 19, 19);
      lensCtx.drawImage(off, px - 9, py - 9, 19, 19, 0, 0, 19, 19);
      lensCtx.strokeStyle = "#ff3b30";
      lensCtx.lineWidth = 1;
      lensCtx.strokeRect(9.5, 9.5, 1, 1);
      lensLabel.textContent =
        p.color.r + ", " + p.color.g + ", " + p.color.b +
        (p.captureId !== meta.captureId ? "  (from shot #" + p.captureId + ")" : "");
    }
    drawMarkers();
    drawSteps();
  }

  img.addEventListener("click", (e) => {
    const rect = img.getBoundingClientRect();
    const k = img.naturalWidth / rect.width;
    setPick(
      Math.round(((e.clientX - rect.left) * k) / meta.scale),
      Math.round(((e.clientY - rect.top) * k) / meta.scale)
    );
    paint();
  });

  const NUDGE = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  document.addEventListener("keydown", (e) => {
    if (overlay.classList.contains("on")) return;
    const p = picked[current];
    if (p && NUDGE[e.key]) {
      e.preventDefault();
      setPick(
        Math.max(0, Math.min(meta.logicalW - 1, p.x + NUDGE[e.key][0])),
        Math.max(0, Math.min(meta.logicalH - 1, p.y + NUDGE[e.key][1]))
      );
      paint();
    } else if (p && e.key === "Enter") {
      e.preventDefault();
      nextBtn.click();
    }
  });

  recapBtn.addEventListener("click", async () => {
    const delay = meta.defaultDelay;
    recapBtn.disabled = true;
    nextBtn.disabled = true;
    overlay.classList.add("on");

    // Display only - the server does the real timing, because a backgrounded
    // tab throttles its own timers and the tab will not be in front.
    let left = delay;
    cdNum.textContent = left || "...";
    const tick = setInterval(() => {
      left -= 1;
      cdNum.textContent = left > 0 ? left : "...";
    }, 1000);

    try {
      const res = await fetch("/capture", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ delay }),
      });
      meta = await res.json();
      await loadShot();
    } finally {
      clearInterval(tick);
      overlay.classList.remove("on");
      recapBtn.disabled = false;
      paint();
    }
  });

  nextBtn.addEventListener("click", async () => {
    if (!picked[current]) return;
    if (current < SPOTS.length - 1) {
      current++;
      paint();
      return;
    }

    nextBtn.disabled = true;
    recapBtn.disabled = true;
    const res = await fetch("/save", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ spots: picked }),
    });
    const out = await res.json();

    document.querySelector("header").style.display = "none";
    wrap.style.display = "none";
    lens.style.display = "none";
    const done = document.getElementById("done");
    done.style.display = "block";
    done.innerHTML =
      "<p>Saved three spots.</p><table>" +
      picked.map((s, i) =>
        "<tr><td>" + (i + 1) + ". " + SPOTS[i].label + "</td>" +
        "<td><code>x=" + s.x + " y=" + s.y + "</code></td>" +
        '<td><span style="display:inline-block;width:12px;height:12px;' +
        "border-radius:3px;border:1px solid #454b55;background:" + hex(s.color) +
        '"></span> <code>' + hex(s.color) + "</code></td>" +
        '<td class="hint">shot #' + s.captureId + "</td></tr>"
      ).join("") +
      "</table><p class=\"hint\">" + out.path + "</p>" +
      "<p class=\"hint\">You can close this tab.</p>";
  });

  paint();
})();
</script>
