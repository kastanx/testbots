<!doctype html>
<meta charset="utf-8">
<title>Pick control pixels</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #14161a; color: #e6e8eb;
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; padding: 10px 16px;
    background: #1b1e24; border-bottom: 1px solid #2b2f36;
  }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .rule { color: #9aa2ad; font-size: 13px; }
  .hint { color: #6f7680; font-size: 12px; }
  .readout { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .swatch {
    width: 24px; height: 24px; border-radius: 5px;
    border: 1px solid #454b55; background: #000;
  }
  code {
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    background: #262a31; padding: 2px 7px; border-radius: 4px;
  }
  button {
    font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 6px;
    border: 1px solid transparent; background: #3b82f6; color: #fff; cursor: pointer;
  }
  button.ghost { background: #2b313a; border-color: #3a424d; }
  button:disabled { background: #333941; color: #71787f; cursor: default; border-color: transparent; }
  #steps { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .step {
    display: flex; align-items: center; gap: 7px; font-size: 12px; cursor: pointer;
    padding: 4px 10px; border-radius: 999px;
    background: #22262d; border: 1px solid #2b2f36; color: #9aa2ad;
  }
  .step.active { border-color: #3b82f6; color: #e6e8eb; }
  .step.done { color: #e6e8eb; }
  .step .dot {
    width: 11px; height: 11px; border-radius: 3px;
    border: 1px solid #454b55; background: #14161a;
  }
  .cap { margin-left: auto; font-size: 12px; color: #6f7680; }
  #flash { min-height: 18px; margin-top: 4px; font-size: 12px; color: #f5b041; }
  #wrap { position: relative; padding: 16px; }
  #shot { display: block; max-width: 100%; height: auto; cursor: crosshair; }
  .marker {
    position: absolute; width: 11px; height: 11px; margin: -6px 0 0 -6px;
    border: 2px solid #34c759; border-radius: 50%; pointer-events: none;
    box-shadow: 0 0 0 1px #000;
  }
  .marker.current { border-color: #ff3b30; }
  .marker.last { width: 15px; height: 15px; margin: -8px 0 0 -8px; box-shadow: 0 0 0 1px #fff; }
  /* A variation already saved (add mode): shown, not touched. */
  .marker.saved { border-color: #9aa2ad; border-style: dashed; }
  /* A block: the outline sits just outside the block's own pixels. */
  .box {
    position: absolute; box-sizing: content-box; margin: -2px 0 0 -2px;
    border: 2px solid #34c759; pointer-events: none; box-shadow: 0 0 0 1px #000;
  }
  .box.current { border-color: #ff3b30; }
  .box.last { box-shadow: 0 0 0 1px #fff; }
  .tag {
    position: absolute; left: calc(100% + 3px); top: -6px; font-size: 10px; font-weight: 700;
    color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000; white-space: nowrap;
  }
  .kept { font-size: 12px; color: #6f7680; }
  #overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(12,14,17,.93); color: #e6e8eb;
    align-items: center; justify-content: center; text-align: center;
  }
  #overlay.on { display: flex; }
  #overlay .big { font-size: 58px; font-weight: 700; line-height: 1.1; }
  #lens {
    position: fixed; right: 20px; bottom: 20px; width: 210px;
    background: #1b1e24; border: 1px solid #2b2f36; border-radius: 8px;
    padding: 10px; display: none;
  }
  #lens canvas {
    width: 190px; height: 190px; display: block;
    image-rendering: pixelated; border-radius: 4px; background: #000;
  }
  #lens p { margin: 8px 0 0; text-align: center; font-size: 12px; color: #9aa2ad; }
  #done { display: none; padding: 40px 16px; text-align: center; font-size: 15px; }
  #done table { margin: 16px auto; border-collapse: collapse; }
  #done td { padding: 5px 12px; text-align: left; }
</style>

<header>
  <div class="row">
    <h1 id="title">Pick control pixels</h1>
    <span class="rule" id="rule"></span>
    <span class="hint">click adds &middot; arrows nudge the last &middot; Backspace removes the last &middot; Enter moves on</span>
    <div class="readout">
      <div class="swatch" id="swatch"></div>
      <code id="coords">&mdash;</code>
      <button class="ghost" id="recap">Recapture</button>
      <button id="next" disabled>Next</button>
    </div>
  </div>
  <div id="steps"></div>
  <div id="flash"></div>
</header>

<div id="wrap">
  <img id="shot" alt="screenshot">
</div>

<div id="overlay">
  <div>
    <div class="big" id="cdNum">5</div>
    <p>Switch to the window you want to capture.<br>Screenshot is taken automatically.</p>
  </div>
</div>

<div id="lens"><canvas id="lensCanvas" width="19" height="19"></canvas><p id="lensLabel">&mdash;</p></div>
<div id="done"></div>

<script>
(async () => {
  let meta = await (await fetch("/meta")).json();
  const GROUPS = meta.groups;   // [{ key, label, count, rule, block? }] - the ones picked this time
  const KEPT = meta.kept || [];  // labels of the groups kept from the file as they are
  // A block group's pick is the middle of a block x block square that runs
  // from (x + BLOCK_FROM, y + BLOCK_FROM).
  const BLOCK_FROM = meta.blockFrom;
  // Adding variations (add-b-archeology.js / add-c-archeology.js): the group added to and its variations
  // already saved - shown, never changed; the new ones are numbered after them.
  const ADDING = meta.adding;   // { key, saved: [{ x, y, color }] } or null
  const savedOf = (g) => (ADDING && ADDING.key === g.key ? ADDING.saved : []);

  const img = document.getElementById("shot");
  const wrap = document.getElementById("wrap");
  const lens = document.getElementById("lens");
  const lensCtx = document.getElementById("lensCanvas").getContext("2d");
  const lensLabel = document.getElementById("lensLabel");
  const swatch = document.getElementById("swatch");
  const coords = document.getElementById("coords");
  const nextBtn = document.getElementById("next");
  const recapBtn = document.getElementById("recap");
  const title = document.getElementById("title");
  const rule = document.getElementById("rule");
  const stepsEl = document.getElementById("steps");
  const flashEl = document.getElementById("flash");
  const overlay = document.getElementById("overlay");
  const cdNum = document.getElementById("cdNum");

  lensCtx.imageSmoothingEnabled = false;

  // Offscreen copy of the current screenshot at natural (physical) size, for
  // exact pixel reads.
  const off = document.createElement("canvas");
  const offCtx = off.getContext("2d", { willReadFrequently: true });

  async function loadShot() {
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = rej;
      img.src = "/shot.png?v=" + meta.captureId;
    });
    off.width = img.naturalWidth;
    off.height = img.naturalHeight;
    offCtx.drawImage(img, 0, 0);
  }
  await loadShot();

  // Per group: [{ x, y, color, captureId }]. A pixel's colour comes from the
  // screenshot loaded when it was picked and is NOT recomputed later - a
  // recapture must not rewrite an earlier pick.
  const picks = Object.fromEntries(GROUPS.map((g) => [g.key, []]));
  let current = 0;

  const colorAtPhysical = (px, py) => {
    const d = offCtx.getImageData(px, py, 1, 1).data;
    return { r: d[0], g: d[1], b: d[2] };
  };
  const hex = ({ r, g, b }) =>
    "#" + [r, g, b].map((c) => c.toString(16).padStart(2, "0")).join("");

  // A logical pixel maps to the top-left of its scale x scale physical block,
  // which is the sample the watcher reads.
  const physOf = (lx, ly) => [Math.round(lx * meta.scale), Math.round(ly * meta.scale)];

  // A block's colours, row by row as hex RRGGBB, from the current screenshot.
  const byteHex = (v) => v.toString(16).padStart(2, "0");
  function blockAt(lx, ly, size) {
    const rows = [];
    for (let dy = 0; dy < size; dy++) {
      let row = "";
      for (let dx = 0; dx < size; dx++) {
        const [px, py] = physOf(lx + BLOCK_FROM + dx, ly + BLOCK_FROM + dy);
        const d = offCtx.getImageData(px, py, 1, 1).data;
        row += byteHex(d[0]) + byteHex(d[1]) + byteHex(d[2]);
      }
      rows.push(row);
    }
    return rows;
  }

  // Where a group's pick can be: for a block group, far enough in that the
  // whole block is on the screenshot.
  const limits = (g) => {
    const near = g.block ? -BLOCK_FROM : 0;
    const far = g.block ? BLOCK_FROM + g.block - 1 : 0;
    return { minX: near, minY: near, maxX: meta.logicalW - 1 - far, maxY: meta.logicalH - 1 - far };
  };

  const makePick = (lx, ly, g) => {
    const [px, py] = physOf(lx, ly);
    const p = { x: lx, y: ly, color: colorAtPhysical(px, py), captureId: meta.captureId };
    if (g.block) p.block = blockAt(lx, ly, g.block);
    return p;
  };

  const group = () => GROUPS[current];
  const list = () => picks[group().key];
  // A variations group takes count or more; the others exactly count.
  const complete = (g) => (g.variations ? picks[g.key].length >= g.count : picks[g.key].length === g.count);
  const tagOf = (g, i) => (g.count > 1 || g.variations ? g.key + (i + 1 + savedOf(g).length) : g.key);

  let flashTimer = null;
  function flash(msg) {
    flashEl.textContent = msg;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => (flashEl.textContent = ""), 2500);
  }

  function drawMarkers() {
    for (const m of wrap.querySelectorAll(".marker, .box")) m.remove();
    const rect = img.getBoundingClientRect();
    const dispScale = rect.width / img.naturalWidth;
    GROUPS.forEach((g) => {
      savedOf(g).forEach((p, i) => {
        const [px, py] = physOf(p.x, p.y);
        const el = document.createElement("div");
        el.className = "marker saved";
        el.style.left = (img.offsetLeft + px * dispScale) + "px";
        el.style.top = (img.offsetTop + py * dispScale) + "px";
        el.innerHTML = '<span class="tag">' + g.key + (i + 1) + " (saved)</span>";
        wrap.appendChild(el);
      });
    });
    GROUPS.forEach((g, gi) => {
      picks[g.key].forEach((p, i) => {
        const el = document.createElement("div");
        const isCurrent = gi === current;
        const isLast = isCurrent && i === picks[g.key].length - 1;
        const state = (isCurrent ? " current" : "") + (isLast ? " last" : "");
        if (g.block) {
          // The block itself, outlined.
          const [bx, by] = physOf(p.x + BLOCK_FROM, p.y + BLOCK_FROM);
          el.className = "box" + state;
          el.style.left = (img.offsetLeft + bx * dispScale) + "px";
          el.style.top = (img.offsetTop + by * dispScale) + "px";
          el.style.width = el.style.height = (g.block * meta.scale * dispScale) + "px";
        } else {
          const [px, py] = physOf(p.x, p.y);
          el.className = "marker" + state;
          el.style.left = (img.offsetLeft + px * dispScale) + "px";
          el.style.top = (img.offsetTop + py * dispScale) + "px";
        }
        el.innerHTML = '<span class="tag">' + tagOf(g, i) + "</span>";
        wrap.appendChild(el);
      });
    });
  }

  function drawSteps() {
    stepsEl.innerHTML = "";
    GROUPS.forEach((g, gi) => {
      const n = picks[g.key].length;
      const last = picks[g.key][n - 1];
      const el = document.createElement("div");
      el.className = "step" + (gi === current ? " active" : complete(g) ? " done" : "");
      const s = savedOf(g).length;
      const count = !g.variations ? n + "/" + g.count
        : s ? s + " saved + " + n + " new"
        : n + " variation" + (n === 1 ? "" : "s");
      el.innerHTML =
        '<span class="dot" style="background:' + (last ? hex(last.color) : "#14161a") + '"></span>' +
        g.label + " &middot; " + count + (complete(g) ? " &#10003;" : "");
      el.addEventListener("click", () => { current = gi; paint(); });
      stepsEl.appendChild(el);
    });
    const keptNames = KEPT.slice();
    if (ADDING && ADDING.saved.length) {
      const n = ADDING.saved.length;
      keptNames.push(ADDING.key + "1" + (n > 1 ? "-" + ADDING.key + n : ""));
    }
    if (keptNames.length) {
      const kept = document.createElement("span");
      kept.className = "kept";
      kept.textContent = "keeping " + keptNames.join(", ") + " as they are";
      stepsEl.appendChild(kept);
    }
    const cap = document.createElement("span");
    cap.className = "cap";
    cap.textContent = "showing screenshot #" + meta.captureId;
    stepsEl.appendChild(cap);
  }

  function paint() {
    const g = group();
    const n = list().length;
    title.textContent = "Group " + g.label + ": " +
      (g.variations && savedOf(g).length
        ? "add variations (" + n + " new, " + savedOf(g).length + " saved)"
        : g.variations
        ? "pick " + g.count + " or more variations (" + n + " picked)"
        : g.count > 1
        ? "pick " + g.count + (g.block ? " blocks of " + g.block + "x" + g.block : " pixels") +
          " (" + n + "/" + g.count + ")"
        : "pick 1 pixel");
    rule.textContent = g.rule;

    const isLastGroup = current === GROUPS.length - 1;
    nextBtn.textContent = isLastGroup ? "Save" : "Next";
    nextBtn.disabled = isLastGroup ? !GROUPS.every(complete) : !complete(g);

    const p = list()[n - 1];
    if (!p) {
      coords.textContent = "—";
      swatch.style.background = "#000";
      lens.style.display = "none";
    } else {
      coords.textContent = tagOf(g, n - 1) + "  x=" + p.x + "  y=" + p.y + "  " + hex(p.color);
      swatch.style.background = hex(p.color);
      lens.style.display = "block";
      const fromShot = p.captureId !== meta.captureId ? "  (from shot #" + p.captureId + ")" : "";
      // The lens shows the current screenshot around the pick.
      const lensCanvas = lensCtx.canvas;
      const size = (n) => {
        if (lensCanvas.width !== n) {
          lensCanvas.width = lensCanvas.height = n;   // resets the context's settings
          lensCtx.imageSmoothingEnabled = false;
        }
        lensCtx.clearRect(0, 0, n, n);
      };
      if (g.block) {
        // The block with a 5-pixel margin, outlined just outside its pixels.
        const side = Math.round(g.block * meta.scale);
        const [bx, by] = physOf(p.x + BLOCK_FROM, p.y + BLOCK_FROM);
        size(side + 10);
        lensCtx.drawImage(off, bx - 5, by - 5, side + 10, side + 10, 0, 0, side + 10, side + 10);
        lensCtx.strokeStyle = "#ff3b30";
        lensCtx.lineWidth = 1;
        lensCtx.strokeRect(4.5, 4.5, side + 1, side + 1);
        lensLabel.textContent = g.block + "x" + g.block + " block, x " + (p.x + BLOCK_FROM) + "-" +
          (p.x + BLOCK_FROM + g.block - 1) + ", y " + (p.y + BLOCK_FROM) + "-" +
          (p.y + BLOCK_FROM + g.block - 1) + fromShot;
      } else {
        const [px, py] = physOf(p.x, p.y);
        size(19);
        lensCtx.drawImage(off, px - 9, py - 9, 19, 19, 0, 0, 19, 19);
        lensCtx.strokeStyle = "#ff3b30";
        lensCtx.lineWidth = 1;
        lensCtx.strokeRect(9.5, 9.5, 1, 1);
        lensLabel.textContent = p.color.r + ", " + p.color.g + ", " + p.color.b + fromShot;
      }
    }
    drawMarkers();
    drawSteps();
  }

  img.addEventListener("click", (e) => {
    const g = group();
    const rect = img.getBoundingClientRect();
    const k = img.naturalWidth / rect.width;
    const lim = limits(g);
    let lx = Math.round(((e.clientX - rect.left) * k) / meta.scale);
    let ly = Math.round(((e.clientY - rect.top) * k) / meta.scale);
    if (g.block && (lx < lim.minX || ly < lim.minY || lx > lim.maxX || ly > lim.maxY)) {
      flash("Too close to the edge - the whole " + g.block + "x" + g.block + " block has to be on the screen");
      return;
    }
    lx = Math.max(lim.minX, Math.min(lim.maxX, lx));
    ly = Math.max(lim.minY, Math.min(lim.maxY, ly));
    const p = makePick(lx, ly, g);
    if (g.variations) {
      list().push(p);
    } else if (g.count === 1) {
      list().splice(0, 1, p);
    } else if (list().length < g.count) {
      list().push(p);
    } else {
      flash("Group " + g.label + " already has " + g.count + " - Backspace removes the last one");
      return;
    }
    paint();
  });

  const NUDGE = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  document.addEventListener("keydown", (e) => {
    if (overlay.classList.contains("on")) return;
    const l = list();
    const p = l[l.length - 1];
    if (p && NUDGE[e.key]) {
      e.preventDefault();
      const lim = limits(group());
      l[l.length - 1] = makePick(
        Math.max(lim.minX, Math.min(lim.maxX, p.x + NUDGE[e.key][0])),
        Math.max(lim.minY, Math.min(lim.maxY, p.y + NUDGE[e.key][1])),
        group()
      );
      paint();
    } else if (e.key === "Backspace") {
      e.preventDefault();
      if (l.length) { l.pop(); paint(); }
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (!nextBtn.disabled) nextBtn.click();
    }
  });

  recapBtn.addEventListener("click", async () => {
    const delay = meta.defaultDelay;
    recapBtn.disabled = true;
    nextBtn.disabled = true;
    overlay.classList.add("on");

    // Display only - the server does the real timing, because a backgrounded
    // tab throttles its own timers and the tab will not be in front.
    let left = delay;
    cdNum.textContent = left || "...";
    const tick = setInterval(() => {
      left -= 1;
      cdNum.textContent = left > 0 ? left : "...";
    }, 1000);

    try {
      const res = await fetch("/capture", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ delay }),
      });
      meta = { ...(await res.json()), groups: GROUPS };
      await loadShot();
    } finally {
      clearInterval(tick);
      overlay.classList.remove("on");
      recapBtn.disabled = false;
      paint();
    }
  });

  nextBtn.addEventListener("click", async () => {
    if (current < GROUPS.length - 1) {
      if (!complete(group())) return;
      current++;
      paint();
      return;
    }
    if (!GROUPS.every(complete)) {
      const missing = GROUPS.filter((g) => !complete(g)).map((g) => g.label).join(", ");
      flash("Still incomplete: " + missing);
      return;
    }

    nextBtn.disabled = true;
    recapBtn.disabled = true;
    const res = await fetch("/save", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ groups: picks }),
    });
    const out = await res.json();
    if (!res.ok) {
      flash("Save failed: " + (out.error || res.status));
      nextBtn.disabled = false;
      recapBtn.disabled = false;
      return;
    }

    document.querySelector("header").style.display = "none";
    wrap.style.display = "none";
    lens.style.display = "none";
    const done = document.getElementById("done");
    done.style.display = "block";
    done.innerHTML =
      "<p>Saved.</p><table>" +
      GROUPS.map((g) => {
        const l = picks[g.key];
        const s = savedOf(g).length;
        const cell = g.variations
          ? (s ? "added " + l.map((p, i) => tagOf(g, i)).join(", ") + " - " + (s + l.length) + " variations in all"
               : l.length + " variation" + (l.length === 1 ? "" : "s"))
          : g.count > 1
          ? l.length + (g.block ? " blocks of " + g.block + "x" + g.block : " pixels")
          : "<code>x=" + l[0].x + " y=" + l[0].y + "</code> " +
            '<span style="display:inline-block;width:12px;height:12px;vertical-align:-1px;' +
            "border-radius:3px;border:1px solid #454b55;background:" + hex(l[0].color) +
            '"></span> <code>' + hex(l[0].color) + "</code>";
        return "<tr><td>" + g.label + "</td><td>" + cell + "</td></tr>";
      }).join("") +
      "</table>" +
      (KEPT.length || (ADDING && ADDING.saved.length)
        ? "<p>Kept as they were: " + KEPT.concat(ADDING && ADDING.saved.length
            ? [ADDING.key + "1" + (ADDING.saved.length > 1 ? "-" + ADDING.key + ADDING.saved.length : "")]
            : []).join(", ") + "</p>"
        : "") +
      "<p class=\"hint\">" + out.path + "</p>" +
      "<p class=\"hint\">You can close this tab.</p>";
  });

  paint();
})();
</script>
